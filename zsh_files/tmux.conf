# tmux.conf — one key, no bar, no splits
# Place: ~/.config/tmux/tmux.conf (symlinked from dot_files)
# Everything goes through M-Esc: a fzf menu (tmux-menu.sh) in a popup.

# ── Terminal & colors ──────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm-256color:RGB"
set -ga terminal-features ",xterm-ghostty:RGB"

# ── Base behavior ──────────────────────────────────────────────
set -g mouse on
set -sg escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g allow-passthrough on

# No status bar: the session and window travel in the terminal title.
set -g set-titles on
set -g set-titles-string '#S:#W'

# ── The only key: M-Esc opens the menu ─────────────────────────
# No prefix: every action lives in the menu (see tmux-menu.sh).
set -g prefix None
unbind C-b
# Nested tmux (ssh to the rasp): the outer server reads the key first, so a
# plain bind would always open the local menu and the remote one would never
# see it. When the active pane runs ssh, pass the key down instead. M-z opens
# the menu of the tmux you are physically in, whatever the pane is doing.
bind -n M-Escape if-shell -F '#{==:#{pane_current_command},ssh}' 'send-keys M-Escape' 'display-popup -E -w 50% -h 50% -T " tmux " "~/.config/tmux/tmux-menu.sh; [ \$? -eq 70 ] && read -r -n1 -s"'
bind -n M-z display-popup -E -w 50% -h 50% -T " tmux " "~/.config/tmux/tmux-menu.sh; [ \$? -eq 70 ] && read -r -n1 -s"

# ── No status bar ──────────────────────────────────────────────
# Session and windows show in the menu header.
set -g status off

# ── Copy mode (vi) ─────────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi q send -X cancel

# ── Catppuccin Mocha ───────────────────────────────────────────
set -g @bg       "#1e1e2e"
set -g @fg       "#cdd6f4"
set -g @blue     "#89b4fa"
set -g @surface0 "#313244"
set -g @surface1 "#45475a"
set -g @mauve    "#cba6f7"
set -g @yellow   "#f9e2af"

set -g message-style "bg=#{@blue},fg=#{@bg},bold"
set -g message-command-style "bg=#{@blue},fg=#{@bg},bold"
set -g mode-style "bg=#{@surface1},fg=#{@fg}"
set -g popup-style "fg=#{@fg},bg=default"
set -g popup-border-lines rounded
set -g popup-border-style "fg=#{@mauve}"
# Reached over ssh: yellow border, to tell the remote menu apart.
if-shell '[ -n "$SSH_CONNECTION" ]' 'set -g popup-border-style "fg=#{@yellow}"'

# ── Plugins: resurrect + continuum (survive reboot/kill) ───────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# resurrect: save pane contents too, not only the layout
set -g @resurrect-capture-pane-contents 'on'
# continuum: auto-restore on start
set -g @continuum-restore 'on'
# continuum autosaves from status-right, dead with the bar off:
# save on every client exit instead (also fires on a killed terminal)
set-hook -g client-detached 'run-shell -b "~/.tmux/plugins/tmux-resurrect/scripts/save.sh quiet"'

# TPM assumes plugins in ~/.config/tmux/plugins when the conf is XDG.
# Ours live in ~/.tmux/plugins — tell TPM, or it silently sources nothing.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'
run '~/.tmux/plugins/tpm/tpm'
