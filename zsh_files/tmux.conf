# tmux.conf — minimal, no splits, aligned with your Neovim/Ghostty setup
# Place: ~/.config/tmux/tmux.conf (symlinked from dot_files)

# ── Terminal & colors ──────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm-256color:RGB"
set -ga terminal-features ",xterm-ghostty:RGB"

# ── Base behavior ──────────────────────────────────────────────
set -g mouse on
set -sg escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g allow-passthrough on

# ── Prefix: M-Esc (Alt+Esc) ───────────────────────────────────
unbind C-b
set -g prefix M-Escape
bind M-Escape send-prefix

# ── Reload config ──────────────────────────────────────────────
bind -N "Reload tmux config" r source-file ~/.config/tmux/tmux.conf \; display "tmux reloaded"

# ── New window (same directory) ────────────────────────────────
bind -N "New window (same dir)" c new-window -c "#{pane_current_path}"

# ── Pane navigation (vim style, with prefix) ───────────────────
bind -N "Focus pane left" h select-pane -L
bind -N "Focus pane down" j select-pane -D
bind -N "Focus pane up" k select-pane -U
bind -N "Focus pane right" l select-pane -R

# ── Resize pane (repeatable, with prefix) ──────────────────────
# You don't split, but resize is still useful with Niri windows side by side
bind -r -N "Resize pane left" H resize-pane -L 5
bind -r -N "Resize pane down" J resize-pane -D 5
bind -r -N "Resize pane up" K resize-pane -U 5
bind -r -N "Resize pane right" L resize-pane -R 5

# ── Zoom pane (toggle fullscreen) ──────────────────────────────
bind -N "Zoom pane (toggle)" z resize-pane -Z

# ── Window navigation ──────────────────────────────────────────
bind -r -N "Next window" n next-window
bind -r -N "Previous window" p previous-window
bind -N "Last window" Tab last-window

# ── Kill ───────────────────────────────────────────────────────
bind -N "Kill pane" x kill-pane
bind -N "Kill window" X kill-window

# ── Copy mode (vi) ─────────────────────────────────────────────
setw -g mode-keys vi
bind -N "Enter copy mode" [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi q send -X cancel

# ── Smart pane switching: C-h/j/k/l without prefix ─────────────
# Inside Neovim: goes to nvim splits (your existing keybinds)
# Inside tmux (at shell): switches panes
# Requires vim-tmux-navigator OR the is_vim pattern below
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# ── Session switcher with fzf ──────────────────────────────────
bind -N "Switch session (fzf)" S run-shell 'tmux switch-client -t "$(tmux list-sessions -F "#{session_name}" | fzf --prompt="tmux > ")"'

# ── Keybinding browser with fzf (prefix + ?) ────────────────────
bind -N "Browse keybinds (fzf)" ? run-shell "~/.config/tmux/tmux-keys.sh"

# ── Command palette (prefix + m) ──────────────────────────
# telescope-like: fzf over every tmux command (list-commands),
# Enter runs it bare. kill-* excluded on purpose: they stay on
# the dedicated bindings (x, X) and the default < > menus only.
# (overrides the default m = select-pane -m, mark pane)
bind -N "Command palette (fzf)" m run-shell "~/.config/tmux/tmux-commands.sh"

# ── Status bar: Catppuccin Mocha ───────────────────────────────
set -g @bg       "#1e1e2e"
set -g @fg       "#cdd6f4"
set -g @mauve    "#cba6f7"
set -g @blue     "#89b4fa"
set -g @surface0 "#313244"
set -g @surface1 "#45475a"
set -g @overlay0 "#6c7086"

set -g status on
set -g status-position top
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 60
set -g status-justify left
set -g status-style "bg=#{@bg},fg=#{@fg}"

# Indicatore prefix attivo: cuando client_prefix è true, la barra diventa blu
# e mostra il comando per aprire la palette dei comandi
set -g status-left  "#[bg=#{?client_prefix,#{@blue},#{@mauve}},fg=#{@bg},bold] #{?client_prefix, CMD ,}#{?client_prefix, m palette ,#S} #[bg=#{@bg},fg=#{?client_prefix,#{@blue},#{@mauve}}]"
set -g status-right "#[fg=#{@overlay0}] #{?client_prefix,[prefix],}%H:%M #[fg=#{@surface1}]| #[fg=#{@fg}]%d %b "

setw -g window-status-format         "#[fg=#{@overlay0}] #I:#W "
setw -g window-status-current-format "#[bg=#{@surface1},fg=#{@mauve},bold] #I:#W "
setw -g window-status-separator ""

setw -g window-status-activity-style "fg=#{@blue},bg=#{@bg}"
setw -g window-status-bell-style     "fg=#{@mauve},bg=#{@bg}"

# ── Pane borders ───────────────────────────────────────────────
set -g pane-border-style "fg=#{@surface1}"
set -g pane-active-border-style "fg=#{@mauve}"

# ── Messages ───────────────────────────────────────────────────
set -g message-style "bg=#{@mauve},fg=#{@bg},bold"
set -g message-command-style "bg=#{@blue},fg=#{@bg}"

# ── Menu popup style ────────────────────────────────────────────
set -g menu-style "fg=#{@fg},bg=#{@surface0}"
set -g menu-border-style "fg=#{@surface1}"

# ── Popup style (command palette) ────────────────────────────
set -g popup-style "fg=#{@fg},bg=#{@surface0}"
set -g popup-border-style "fg=#{@surface1}"

# ── Plugins: resurrect + continuum (survive reboot/kill) ───────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# resurrect: salva contenuto dei pane, non solo layout
set -g @resurrect-capture-pane-contents 'on'
# continuum: auto-salva ogni 15 min, auto-restore all'avvio
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Manual save/restore: prefix + C-s / C-r
# (default TPM keys, li lasciamo)

run '~/.tmux/plugins/tpm/tpm'
