[dev-arch]
image=archlinux:latest
home=/home/filippo/distrobox/dev-arch
nvidia=true
additional_packages="zsh starship neovim fzf git curl base-devel bat fd tree bun python"
init_hooks=su - filippo -c "test -d ~/git_projects/dot_files || git clone https://github.com/FilMar/dot_files.git ~/git_projects/dot_files; bash ~/git_projects/dot_files/scripts/distrobox_setup.sh"

# Container definitions, read by `distrobox assemble create --file distrobox.ini`.
# Each [section] below makes one container.
#
# [dev-arch]: Arch Linux box for development.
#   image                base OCI image the container is built from.
#   home                 private home dir, so the host home stays clean; this
#                        is also why the dotfiles must be installed inside.
#   nvidia               mounts the NVIDIA driver from the host.
#   additional_packages  extra packages installed at creation time.
#   init_hooks           runs at the end of creation, as root: `su - filippo -c`
#                        drops to the user first, clones dot_files if missing,
#                        then runs scripts/distrobox_setup.sh inside the box.
